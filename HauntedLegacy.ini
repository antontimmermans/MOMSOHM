description.English=<i>Haverleigh Trading Company is known for its business in exotic and exclusive artifacts, but also for the tragedies that seem to haunt the Haverleigh family. Helping a friend with a séance should help a grieving family to move on.</i>\n\nThis whodunnit-style scenario includes elaborate narrative, a moderate amount of battle, and light puzzle challenges.\nThe maximum board size for this scenario is 2,5 by 2 square tiles.\n\nA scenario for Mansions of Madness 2nd Edition. This scenario can be played with the base tiles.
